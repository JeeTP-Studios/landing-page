<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JeeTP Studios — Fabrica de experiencias digitales</title>
<meta name="theme-color" content="#0b042a">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&f[]=satoshi@400,500,700&f[]=cabinet-grotesk@800,900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#fff;--muted:rgba(255,255,255,.55);--muted-2:rgba(255,255,255,.3);
    --line:rgba(255,255,255,.12);--line-2:rgba(255,255,255,.22);
    --accent:#7c5cff;--pink:#ff2e76;--deep:#070219;
    --display:"Clash Display",sans-serif;--black:"Cabinet Grotesk",sans-serif;--body:"Satoshi",sans-serif;
    --maxw:1440px;--ease:cubic-bezier(.19,1,.22,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:#0b042a;color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;overflow-x:hidden;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  body::-webkit-scrollbar{width:0}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 46px;position:relative;z-index:2}
  @media(max-width:640px){.wrap{padding:0 22px}}

  /* global background media */
  #siteBg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  #siteBg img,#siteBg video{width:100%;height:100%;object-fit:cover}

  /* header */
  header{position:fixed;top:0;left:0;right:0;z-index:2000;padding:26px 46px;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none}
  @media(max-width:640px){header{padding:18px 22px}}
  header *{pointer-events:auto}
  .logo{font-family:var(--black);font-weight:900;font-size:20px;letter-spacing:.04em;line-height:1}
  .logo small{display:block;font-family:var(--body);font-weight:500;font-size:9px;letter-spacing:.34em;color:var(--muted);margin-top:5px}
  .crumb{display:flex;gap:10px;align-items:center;font-family:var(--body);font-weight:500;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-2)}
  .crumb a:hover{color:#fff}.crumb .on{color:#fff}
  .hgroup{display:flex;gap:10px}
  .hbtn{width:48px;height:48px;border:1px solid var(--line-2);border-radius:9px;background:rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.3s var(--ease)}
  .hbtn:hover{background:rgba(255,255,255,.12)}
  .hbtn span,.hbtn span::before,.hbtn span::after{content:"";display:block;width:18px;height:2px;background:var(--ink);border-radius:2px;position:relative;transition:.3s}
  .hbtn span::before{position:absolute;top:-6px}.hbtn span::after{position:absolute;top:6px}
  .hbtn.x span{background:transparent}.hbtn.x span::before{top:0;transform:rotate(45deg)}.hbtn.x span::after{top:0;transform:rotate(-45deg)}
  .gear{font-size:18px}
  .menu{position:fixed;inset:0;z-index:1900;background:var(--deep);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:18px;opacity:0;visibility:hidden;transition:.5s var(--ease)}
  .menu.open{opacity:1;visibility:visible}
  .menu a{font-family:var(--display);font-weight:600;font-size:clamp(30px,5vw,58px);letter-spacing:-.02em;color:var(--muted);transition:color .3s}
  .menu a:hover{color:var(--ink)}

  /* case nav */
  .casenav{position:absolute;top:30px;left:0;right:0;z-index:60;padding:0 46px;opacity:0;transition:opacity .4s var(--ease);pointer-events:none}
  .casenav-inner{display:flex;gap:28px;justify-content:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:22px;max-width:1180px;margin:0 auto}
  .casenav a{font-family:var(--display);font-weight:500;font-size:18px;color:var(--muted-2);transition:color .35s;letter-spacing:-.01em;pointer-events:auto;cursor:pointer}
  .casenav a.on{color:var(--ink)}
  @media(max-width:900px){.casenav{display:none}}

  /* pinned */
  .pin{position:relative;z-index:1}
  .pin-sticky{position:sticky;top:0;height:100vh;overflow:hidden;cursor:pointer}
  @supports(height:100svh){.pin-sticky{height:100svh}}
  .panel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;will-change:opacity}
  .panel-ov{position:absolute;inset:0;z-index:0}
  .pname-ghost{position:absolute;top:50%;left:50%;font-family:var(--black);font-weight:900;font-size:clamp(110px,26vw,460px);line-height:.8;letter-spacing:-.04em;white-space:nowrap;color:rgba(255,255,255,.08);pointer-events:none;z-index:1;will-change:transform}
  .emblem{position:relative;z-index:2;width:clamp(200px,32vw,440px);height:clamp(200px,32vw,440px);display:flex;align-items:center;justify-content:center;will-change:transform}
  .emblem img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 40px 80px rgba(0,0,0,.5))}
  .emblem .mono{width:78%;height:78%;border-radius:30%;display:flex;align-items:center;justify-content:center;font-family:var(--black);font-weight:900;font-size:clamp(60px,10vw,130px);color:#fff;box-shadow:0 40px 120px rgba(0,0,0,.5)}
  .meta{position:absolute;z-index:6;left:46px;bottom:60px;will-change:transform}
  .meta .plogo{width:54px;height:54px;border-radius:12px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-family:var(--black);font-weight:900;font-size:22px;margin-bottom:18px;overflow:hidden}
  .meta .plogo img{width:100%;height:100%;object-fit:cover}
  .meta .tags{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .tag{font-family:var(--body);font-weight:600;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:6px 12px;border-radius:100px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2)}
  .meta h2{font-family:var(--black);font-weight:900;font-size:clamp(40px,7vw,104px);line-height:.9;letter-spacing:-.03em;text-transform:uppercase}
  .desc{position:absolute;z-index:6;right:46px;bottom:66px;max-width:42ch;text-align:right;font-size:clamp(15px,1.7vw,21px);color:rgba(255,255,255,.85);line-height:1.45;will-change:transform}
  .contactball{position:absolute;z-index:6;right:46px;bottom:46px;width:120px;height:120px;animation:spin 16s linear infinite;pointer-events:none}
  .contactball .core{position:absolute;top:50%;left:50%;width:70px;height:70px;transform:translate(-50%,-50%);border-radius:50%;background:conic-gradient(from 0deg,#7c5cff,#ff2e76,#ffb13b,#2fd98a,#7c5cff);filter:blur(2px)}
  .contactball svg{width:100%;height:100%}
  @keyframes spin{to{transform:rotate(360deg)}}

  .hero-hud{position:absolute;inset:0;z-index:3;pointer-events:none}
  .hero-hud .corner{position:absolute;width:34px;height:34px;border:1px solid var(--line-2)}
  .hero-hud .c1{top:24%;left:46px;border-right:0;border-bottom:0}.hero-hud .c2{top:24%;right:46px;border-left:0;border-bottom:0}
  .hero-hud .c3{bottom:14%;left:46px;border-right:0;border-top:0}.hero-hud .c4{bottom:14%;right:46px;border-left:0;border-top:0}
  .hero-hud .col{position:absolute;top:34%;display:flex;flex-direction:column;gap:30px;font-family:var(--display);font-size:15px;color:rgba(255,255,255,.3)}
  .hero-hud .col sup{font-size:9px}.hero-hud .left{left:64px}.hero-hud .right{right:64px;text-align:right}
  .hero-center{position:relative;z-index:4;text-align:center;padding:0 24px}
  .hero-center .eye{font-family:var(--body);font-weight:600;font-size:13px;letter-spacing:.34em;text-transform:uppercase;color:rgba(255,255,255,.75);margin-bottom:26px}
  .hero-center h1{font-family:var(--black);font-weight:900;font-size:clamp(32px,5.4vw,82px);line-height:1.02;letter-spacing:-.02em;text-transform:uppercase;max-width:18ch;margin:0 auto}
  .scrollcue{position:absolute;left:50%;bottom:8%;z-index:4;width:110px;height:110px;pointer-events:none;will-change:transform}
  .scrollcue .rot{position:absolute;inset:0;animation:spin 14s linear infinite}
  .scrollcue::after{content:"";position:absolute;top:50%;left:50%;width:5px;height:5px;border-radius:50%;background:#fff;transform:translate(-50%,-50%)}
  .scrollcue svg{width:100%;height:100%}

  .floatlearn{position:fixed;top:0;left:0;z-index:80;width:148px;height:148px;border-radius:50%;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.07);backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transform:translate(-50%,-50%) scale(.6);opacity:0;transition:opacity .4s var(--ease),transform .4s var(--ease);pointer-events:none}
  .floatlearn.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .floatlearn .ar{font-size:24px}.floatlearn small{font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.16em}
  @media(max-width:900px){.floatlearn{width:118px;height:118px}.meta{left:22px;bottom:120px}.desc{left:22px;right:22px;bottom:34px;text-align:left;max-width:none}.contactball{display:none}.hero-hud .col{display:none}}

  section.blk{position:relative;z-index:1;padding:130px 0;overflow:hidden}
  .blk-ov{position:absolute;inset:0;z-index:0}
  .lbl{font-family:var(--body);font-weight:600;font-size:13px;letter-spacing:.26em;text-transform:uppercase;color:var(--pink);margin-bottom:22px}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:30px;margin-bottom:56px;flex-wrap:wrap}
  .head h2{font-family:var(--black);font-weight:900;font-size:clamp(34px,5vw,68px);letter-spacing:-.02em;text-transform:uppercase;line-height:.95}
  .ghost-btn{font-family:var(--body);font-weight:600;font-size:14px;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line-2);padding:16px 26px;display:inline-flex;align-items:center;gap:12px;transition:.3s var(--ease)}
  .ghost-btn:hover{background:#fff;color:var(--deep)}
  .hrow{display:flex;gap:26px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}.hrow::-webkit-scrollbar{display:none}
  .hcard{position:relative;flex:0 0 clamp(260px,30vw,420px);aspect-ratio:3/4;overflow:hidden;background:#15103a;cursor:pointer}
  .hcard .br{position:absolute;width:26px;height:26px;border:2px solid rgba(255,255,255,.8);z-index:3}
  .hcard .br.tl{top:14px;left:14px;border-right:0;border-bottom:0}.hcard .br.tr{top:14px;right:14px;border-left:0;border-bottom:0}
  .hcard .br.bl{bottom:14px;left:14px;border-right:0;border-top:0}.hcard .br.brr{bottom:14px;right:14px;border-left:0;border-top:0}
  .hcard .fill{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--black);font-weight:900;font-size:clamp(52px,8vw,108px);color:rgba(255,255,255,.9);transition:transform .6s var(--ease)}
  .hcard:hover .fill{transform:scale(1.05)}
  .hcard .htags{position:absolute;top:30px;left:30px;z-index:3;display:flex;gap:7px;flex-wrap:wrap}
  .htags .t{font-family:var(--body);font-weight:600;font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:rgba(0,0,0,.55);padding:6px 11px;border-radius:3px}
  .hcard .hn{position:absolute;left:30px;bottom:28px;z-index:3;font-family:var(--display);font-weight:600;font-size:26px}
  .srow{display:flex;gap:22px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}.srow::-webkit-scrollbar{display:none}
  .scard{flex:0 0 clamp(240px,26vw,360px);aspect-ratio:5/7;border-radius:4px;padding:40px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;transition:transform .45s var(--ease)}
  .scard:hover{transform:translateY(-8px)}
  .scard h3{font-family:var(--black);font-weight:900;font-size:clamp(22px,2.4vw,32px);text-transform:uppercase;line-height:1}
  .scard .sb{border-top:1px solid rgba(255,255,255,.4);padding-top:16px;font-size:14px;color:rgba(255,255,255,.9)}
  .scard .sb b{display:block;font-weight:400;border-top:1px solid rgba(255,255,255,.3);margin-top:14px;padding-top:14px}
  .arrows{display:flex;gap:12px;margin-top:34px}
  .arrows button{width:54px;height:54px;border:1px solid var(--line-2);background:transparent;color:#fff;cursor:pointer;font-size:18px;transition:.3s var(--ease)}
  .arrows button:hover{background:#fff;color:var(--deep)}
  .clgrid{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}
  .cl{aspect-ratio:5/3;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--black);font-weight:900;font-size:18px;color:var(--muted-2);transition:.4s var(--ease);text-align:center;padding:10px}
  .cl:hover{color:var(--ink);background:rgba(255,255,255,.03)}
  @media(max-width:900px){.clgrid{grid-template-columns:repeat(3,1fr)}}@media(max-width:560px){.clgrid{grid-template-columns:repeat(2,1fr)}}
  .faqgrid{display:grid;grid-template-columns:1.3fr 1fr;gap:60px}
  .faq-item{border-top:1px solid var(--line)}
  .faq-q{width:100%;text-align:left;background:none;border:0;color:var(--ink);cursor:pointer;padding:30px 0;display:flex;align-items:center;justify-content:space-between;gap:20px;font-family:var(--display);font-weight:500;font-size:clamp(18px,2vw,24px)}
  .faq-q .pm{flex:0 0 auto;color:var(--pink);font-size:26px}
  .faq-a{max-height:0;overflow:hidden;transition:max-height .5s var(--ease)}
  .faq-a p{padding:0 0 30px;color:var(--muted);font-size:16px;line-height:1.6;max-width:54ch}
  .faqbox{border:1px solid var(--line-2);padding:54px;display:flex;flex-direction:column;align-items:center;text-align:center;justify-content:center}
  .faqbox .env{font-size:46px;margin-bottom:26px}.faqbox h3{font-family:var(--display);font-weight:500;font-size:30px;margin-bottom:14px}
  .faqbox p{color:var(--muted);margin-bottom:30px}
  .faqbox a{border:1px solid var(--line-2);padding:15px 28px;font-family:var(--body);font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;transition:.3s var(--ease)}
  .faqbox a:hover{background:#fff;color:var(--deep)}
  @media(max-width:820px){.faqgrid{grid-template-columns:1fr}}
  footer{position:relative;z-index:1;border-top:1px solid var(--line);padding:80px 0 40px;background:var(--deep)}
  .fcols{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:40px;margin-bottom:60px}
  .fbrand .logo{margin-bottom:24px}.fbrand .fa{color:var(--muted);font-size:14px;line-height:1.7;margin-top:6px}
  .fbrand .fl{font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted-2);margin-top:18px}
  .fcol h5{font-family:var(--display);font-weight:500;font-size:20px;margin-bottom:22px}
  .fcol a{display:block;color:var(--muted);font-size:15px;padding:7px 0;transition:color .25s}.fcol a:hover{color:#fff}
  .hireus{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;border-top:1px solid var(--line);padding:34px 0}
  .hireus span{font-family:var(--display);font-weight:500;font-size:clamp(20px,2.4vw,30px)}
  .hireus a{background:var(--pink);color:#fff;padding:15px 34px;font-family:var(--body);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:14px;transition:.3s var(--ease)}
  .hireus a:hover{filter:brightness(1.12);transform:translateY(-2px)}
  .fbot{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted-2);padding-top:24px}
  @media(max-width:820px){.fcols{grid-template-columns:1fr 1fr}.fbrand{grid-column:1/-1}}
  .reveal{opacity:0;transform:translateY(40px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
  .reveal.in{opacity:1;transform:none}

  /* ===== project detail ===== */
  .pd{position:relative;z-index:1;padding-top:150px}
  .pd .pd-hero{min-height:80vh;display:flex;align-items:center;position:relative;overflow:hidden;border-radius:20px;margin:0 0 90px}
  .pd .pd-hero .ov{position:absolute;inset:0;z-index:0}
  .pd .pd-ghost{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:var(--black);font-weight:900;font-size:clamp(120px,24vw,420px);color:rgba(255,255,255,.08);z-index:1;white-space:nowrap}
  .pd .pd-emb{position:relative;z-index:2;margin:0 auto;width:min(60%,520px)}
  .pd .pd-emb img{width:100%;object-fit:contain}
  .pd .pd-emb .mono{aspect-ratio:1;border-radius:26%;display:flex;align-items:center;justify-content:center;font-family:var(--black);font-weight:900;font-size:120px}
  .pd-specs{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;margin-bottom:100px}
  .pd-specs .s small{font-family:var(--body);font-weight:600;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted-2)}
  .pd-specs .s div{margin-top:10px;display:inline-block;background:rgba(255,255,255,.08);border:1px solid var(--line);padding:9px 16px;border-radius:6px;font-weight:600;font-size:14px}
  .pd-2col{display:grid;grid-template-columns:1fr 1.4fr;gap:60px;margin-bottom:100px}
  .pd-2col h2{font-family:var(--black);font-weight:900;font-size:clamp(40px,6vw,84px);line-height:.92;text-transform:uppercase}
  .pd-2col h2 b{color:var(--pink)}
  .pd-2col .ov-lbl{font-family:var(--body);font-weight:700;font-size:13px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:18px}
  .pd-2col p{color:rgba(255,255,255,.7);font-size:18px;line-height:1.6;margin-bottom:16px}
  .pd-process{margin-bottom:100px}
  .pd-process h2{font-family:var(--black);font-weight:900;font-size:clamp(32px,4.6vw,60px);text-transform:uppercase;margin-bottom:46px}
  .pd-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
  .pd-step{border:1px solid var(--line-2);border-radius:8px;padding:30px;min-height:200px;display:flex;flex-direction:column;justify-content:space-between;transition:.4s var(--ease)}
  .pd-step:hover{transform:translateY(-6px)}
  .pd-step .n{font-family:var(--black);font-weight:900;font-size:42px}
  .pd-step .t{font-family:var(--display);font-weight:600;font-size:18px;text-transform:uppercase;line-height:1.05}
  @media(max-width:900px){.pd-steps{grid-template-columns:repeat(2,1fr)}.pd-2col{grid-template-columns:1fr}.pd-specs{grid-template-columns:1fr}}
  .pd-card{border-radius:18px;overflow:hidden;display:grid;grid-template-columns:1.3fr 1fr;margin-bottom:30px}
  .pd-card .txt{padding:54px}
  .pd-card .txt h2{font-family:var(--black);font-weight:900;font-size:clamp(34px,4.4vw,56px);text-transform:uppercase;margin-bottom:24px}
  .pd-card .txt p,.pd-card .txt li{font-size:16px;line-height:1.6}
  .pd-card .txt ul{margin-top:14px;padding-left:20px}
  .pd-card .side{display:flex;align-items:center;justify-content:center;font-family:var(--black);font-weight:900;font-size:120px;opacity:.5}
  @media(max-width:760px){.pd-card{grid-template-columns:1fr}.pd-card .side{display:none}}
  .pd-back{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line-2);padding:14px 24px;border-radius:100px;font-family:var(--body);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:60px;transition:.3s var(--ease)}
  .pd-back:hover{background:#fff;color:var(--deep)}

  /* ===== ADMIN ===== */
  #admin{position:fixed;inset:0;z-index:5000;background:#0c0c12;display:none;overflow-y:auto;color:#e9e9ef;font-family:var(--body)}
  #admin.show{display:block}
  .ad-top{position:sticky;top:0;z-index:5;background:#111119;border-bottom:1px solid #23232f;padding:16px 26px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .ad-top h1{font-family:var(--black);font-weight:900;font-size:18px;letter-spacing:.02em}
  .ad-top .sub{font-size:12px;color:#7d7d8c}
  .ad-actions{display:flex;gap:10px;flex-wrap:wrap}
  .ad-btn{border:0;border-radius:8px;padding:11px 18px;font-family:var(--body);font-weight:700;font-size:13px;cursor:pointer;transition:.2s}
  .ad-btn.primary{background:#7c5cff;color:#fff}.ad-btn.primary:hover{background:#6a49f0}
  .ad-btn.ghost{background:#1c1c28;color:#e9e9ef}.ad-btn.ghost:hover{background:#26263a}
  .ad-btn.warn{background:#2a1620;color:#ff6b9d}
  .ad-body{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 64px)}
  .ad-tabs{border-right:1px solid #23232f;padding:18px 12px;display:flex;flex-direction:column;gap:4px}

/* ============ STATE ============ */
function deepMerge(base, ov){
  if(Array.isArray(base)) return Array.isArray(ov)?ov:base;
  if(typeof base==="object" && base){ const o={...base}; for(const k in base){ if(ov && k in ov) o[k]=deepMerge(base[k],ov[k]); } return o; }
  return ov===undefined?base:ov;
}
function clone(o){return JSON.parse(JSON.stringify(o));}
let CONFIG = clone(DEFAULTS);
try{ const s=localStorage.getItem("jeetp_cfg"); if(s) CONFIG=deepMerge(DEFAULTS, JSON.parse(s)); }catch(e){}
function persist(){ try{localStorage.setItem("jeetp_cfg", JSON.stringify(CONFIG));}catch(e){} }

const grad = o => `linear-gradient(${o.angle||140}deg,${o.gradA||'#0b042a'},${o.gradB||'#0b042a'})`;
const esc = s => {
  if(s==null) return "";
  if(Array.isArray(s)) s = s.map(x=>Array.isArray(x)?x.join(" "):x).join(", ");
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
};

        <div class="ci-lbl">E-mail</div><div class="ci-v">${esc(c.contact.email)}</div>

function sendContact(){
  const g=id=>(document.getElementById(id)?.value||"").trim();
  if(!g("cf_email") && !g("cf_name")){ alert("Escribe al menos tu nombre o correo."); return; }
  const subj=encodeURIComponent("Nuevo contacto desde el sitio"+(g("cf_company")?" — "+g("cf_company"):""));
  const body=encodeURIComponent(`Servicio: ${g("cf_service")}\nNombre: ${g("cf_name")}\nTelefono: ${g("cf_phone")}\nEmail: ${g("cf_email")}\nEmpresa: ${g("cf_company")}\n\nProyecto:\n${g("cf_msg")}`);
  window.location.href=`mailto:${CONFIG.contact.email}?subject=${subj}&body=${body}`;
}

/* ============ BACKGROUND MEDIA ============ */
function applyBg(isHome){
  const el=document.getElementById("siteBg"); const b=CONFIG.bg;
  if(isHome && b.type==="image" && b.url) el.innerHTML=`<img src="${esc(b.url)}" alt="">`;
  else if(isHome && b.type==="video" && b.url) el.innerHTML=`<video autoplay muted loop playsinline src="${esc(b.url)}"></video>`;
  else el.innerHTML="";
}

/* ============ REVEAL + ROWS ============ */
function observeReveal(){
  const io=new IntersectionObserver(e=>e.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target);}}),{threshold:.14});
  document.querySelectorAll(".reveal").forEach(el=>io.observe(el));
}
function initRows(){
  document.querySelectorAll("[data-row]").forEach(btn=>btn.addEventListener("click",()=>{
    const row=document.getElementById(btn.dataset.row); if(!row)return;
    const card=row.querySelector(":scope > *"); const step=card?card.getBoundingClientRect().width+22:300;
    row.scrollBy({left:step*(+btn.dataset.dir),behavior:"smooth"});
  }));
}

/* ============ HOME INTERACTIONS ============ */
let homeToken=0;
function initHome(){
  const pin=document.querySelector(".pin"); if(!pin) return;
  const myToken=++homeToken;
  const sticky=document.getElementById("pinSticky");
  const panels=[...document.querySelectorAll(".panel")];
  const navWrap=document.getElementById("casenav"), navs=[...document.querySelectorAll("#casenav a")];
  const N=panels.length; let cur=0,target=0;
  const smooth=e=>e*e*(3-2*e);
  function read(){ const r=pin.getBoundingClientRect(); const total=pin.offsetHeight-sticky.offsetHeight; target=(total>0?Math.min(Math.max(-r.top/total,0),1):0)*(N-1); }
  function frame(){
    if(myToken!==homeToken) return;
    if(!isFinite(cur))cur=0; if(!isFinite(target))target=0;
    cur+=(target-cur)*0.09; if(Math.abs(target-cur)<0.0008)cur=target;
    for(let i=0;i<N;i++){ const d=cur-i, ad=Math.min(Math.abs(d),1), op=1-smooth(ad), p=panels[i];
      p.style.opacity=op; p.style.zIndex=Math.round(op*1000); p.style.pointerEvents=op>0.55?"auto":"none";
      const em=p.querySelector(".emblem"); if(em)em.style.transform=`translateY(${d*55}px) scale(${1-ad*0.12})`;
      const gh=p.querySelector(".pname-ghost"); if(gh)gh.style.transform=`translate(-50%,-50%) translateX(${d*-60}px)`;
      const mt=p.querySelector(".meta"); if(mt)mt.style.transform=`translateY(${d*70}px)`;
      const ds=p.querySelector(".desc"); if(ds)ds.style.transform=`translateY(${d*70}px)`;
    }
    const near=Math.round(cur), frac=Math.abs(cur-near);
    if(navWrap)navWrap.style.opacity=Math.min(frac*4,1);
    navs.forEach((a,idx)=>a.classList.toggle("on",idx+1===near));
    requestAnimationFrame(frame);
  }
  if(window.__homeScroll){ removeEventListener("scroll",window.__homeScroll); removeEventListener("resize",window.__homeScroll); }
  window.__homeScroll=read; addEventListener("scroll",read,{passive:true}); addEventListener("resize",read); read(); requestAnimationFrame(frame);
  navs.forEach(a=>a.addEventListener("click",e=>{e.stopPropagation(); const i=+a.dataset.i,total=pin.offsetHeight-sticky.offsetHeight; window.scrollTo({top:pin.offsetTop+(N>1?(i/(N-1)):0)*total,behavior:"smooth"});}));
  sticky.addEventListener("click",()=>{ if(!N)return; const a=Math.max(0,Math.min(N-1,Math.round(cur)||0)); const el=panels[a]; if(!el)return; const href=el.dataset.href; if(href&&href!=="#"){ location.hash=href.replace(/^#/,""); } });

  /* floating learn-more */
  const fl=document.getElementById("floatLearn"); const touch=window.matchMedia("(hover:none)").matches;
  window.__mouse=window.__mouse||{x:innerWidth/2,y:innerHeight/2};
  if(!window.__mouseBound){ addEventListener("mousemove",e=>{window.__mouse.x=e.clientX;window.__mouse.y=e.clientY;}); window.__mouseBound=true; }
  if(fl){ if(touch){ fl.style.left="50%"; fl.style.top="62%"; const io=new IntersectionObserver(es=>es.forEach(x=>fl.classList.toggle("show",x.isIntersecting)),{threshold:.3}); io.observe(sticky); }
  else{ let fx=window.__mouse.x,fy=window.__mouse.y;
    (function loop(){ if(myToken!==homeToken){fl.classList.remove("show");return;} fx+=(window.__mouse.x-fx)*0.18;fy+=(window.__mouse.y-fy)*0.18;fl.style.left=fx+"px";fl.style.top=fy+"px";requestAnimationFrame(loop);})();
    sticky.addEventListener("mouseenter",()=>fl.classList.add("show")); sticky.addEventListener("mouseleave",()=>fl.classList.remove("show")); } }

  /* scroll-cue subtle parallax */
  const cue=document.getElementById("scrollcue");
  if(cue && !touch){ let cx=innerWidth/2,cy=innerHeight*0.92,tx=0,ty=0,px=0,py=0;
    addEventListener("mousemove",e=>{ const dx=(e.clientX-cx)/innerWidth, dy=(e.clientY-cy)/innerHeight; tx=Math.max(-1,Math.min(1,dx*2))*8; ty=Math.max(-1,Math.min(1,dy*2))*8; });
    (function loop(){ if(myToken!==homeToken)return; px+=(tx-px)*0.1; py+=(ty-py)*0.1; cue.style.transform=`translate(calc(-50% + ${px}px), ${py}px)`; requestAnimationFrame(loop); })();
  }

  document.querySelectorAll(".hcard").forEach(h=>h.addEventListener("click",()=>{const href=h.dataset.href; if(href)location.hash=href.replace(/^#/,"");}));

  const row=document.getElementById("srow");
  if(row){ const step=()=>row.querySelector(".scard").getBoundingClientRect().width+22;
    const n=document.getElementById("snext"),p=document.getElementById("sprev");
    if(n)n.onclick=()=>row.scrollBy({left:step(),behavior:"smooth"}); if(p)p.onclick=()=>row.scrollBy({left:-step(),behavior:"smooth"}); }

  initFaqGlobal(); observeReveal();
}
function initFaqGlobal(){
  document.querySelectorAll(".faq-q").forEach(q=>q.addEventListener("click",()=>{
    const it=q.parentElement,a=it.querySelector(".faq-a"),pm=q.querySelector(".pm"),open=a.style.maxHeight&&a.style.maxHeight!=="0px";
    document.querySelectorAll(".faq-a").forEach(x=>x.style.maxHeight=null);
    document.querySelectorAll(".faq-q .pm").forEach(x=>x.textContent="+");
    if(!open){a.style.maxHeight=a.scrollHeight+"px";pm.textContent="−";}}));
}

/* ============ ROUTER ============ */
function route(){
  const adminOn = location.hash==="#admin" || location.pathname.replace(/\/$/,"").endsWith("/admin");
  document.getElementById("admin").classList.toggle("show", adminOn);
  document.body.style.overflow = adminOn ? "hidden" : "";
  if(adminOn){ buildAdmin(); return; }
  const h=location.hash;
  if(h.startsWith("#project/")) renderProject(h.slice(9));
  else if(h==="#about") renderAbout();
  else if(h==="#services") renderServices();
  else if(h==="#cases") renderCases();
  else if(h==="#contact") renderContact();
  else renderHome();
}
addEventListener("hashchange", route);

/* nav + menu */
function closeMenu(){ document.getElementById("menuBtn").classList.remove("x"); document.getElementById("menu").classList.remove("open"); }
document.getElementById("menuBtn").addEventListener("click",function(){this.classList.toggle("x");document.getElementById("menu").classList.toggle("open");});
document.getElementById("gearBtn").addEventListener("click",()=>location.hash="admin");
document.addEventListener("click",e=>{const g=e.target.closest("[data-go]"); if(g){ e.preventDefault(); closeMenu(); goTo(g.dataset.go); }});
function goTo(r){ const m={home:"",about:"#about",services:"#services",cases:"#cases",contact:"#contact"};
  const hash = (r in m)? m[r] : (r.startsWith("#")?r:"#"+r);
  if((location.hash||"")===hash){ window.scrollTo({top:0,behavior:"smooth"}); return; }
  location.hash=hash;
}

/* ============ ADMIN PANEL ============ */
const TABS=[["global","Global"],["home","Home"],["about","About Us"],["servicesPage","Services"],["cases","Case Studies"],["contact","Contacto"]];
let curTab="global";
function buildAdmin(){
  const tabs=document.getElementById("adTabs");
  tabs.innerHTML=TABS.map(([k,n])=>`<button class="ad-tab ${k===curTab?'on':''}" data-tab="${k}">${n}</button>`).join("");
  tabs.querySelectorAll(".ad-tab").forEach(b=>b.onclick=()=>{curTab=b.dataset.tab;buildAdmin();document.getElementById("adMain").scrollTop=0;});
  document.getElementById("adMain").innerHTML=`<div class="ad-sec on">${SEC[curTab]()}</div>`;
  bindAdmin();
}

/* ----- path helpers ----- */
function getPath(p){ return p.split(".").reduce((o,k)=>o&&o[k],CONFIG); }
function setPath(p,v){ const ks=p.split("."); let o=CONFIG; for(let i=0;i<ks.length-1;i++)o=o[ks[i]]; o[ks[ks.length-1]]=v; }
function rawVal(path,list){ let v=getPath(path);
  if(list==="steps") return (v||[]).map(s=>Array.isArray(s)?s[1]:s).join("\n");
  if(Array.isArray(v)) return list==="commas"? v.join(", ") : v.join("\n");
  return v==null?"":v;
}

/* ----- field builders ----- */
function textField(label,path,area,hint,list){ const v=rawVal(path,list); const la=list?` data-list="${list}"`:"";
  return `<div class="fld"><label>${label}</label>${area?`<textarea data-bind="${path}"${la}>${esc(v)}</textarea>`:`<input type="text" data-bind="${path}"${la} value="${esc(v)}">`}${hint?`<div class="hint">${hint}</div>`:""}</div>`; }
function colorField(label,path,hint){ const v=getPath(path)||"#000000"; return `<div class="fld"><label>${label}</label><div class="colorpick"><input type="color" data-color="${path}" value="${v}"><input type="text" data-bind="${path}" value="${v}"></div>${hint?`<div class="hint">${hint}</div>`:""}</div>`; }
function gradField(prefix){ return `<div class="fld"><label>Degradado de fondo</label><div class="row">
   <div class="colorpick"><input type="color" data-color="${prefix}.gradA" value="${getPath(prefix+'.gradA')}"><input type="text" data-bind="${prefix}.gradA" value="${getPath(prefix+'.gradA')}"></div>
   <div class="colorpick"><input type="color" data-color="${prefix}.gradB" value="${getPath(prefix+'.gradB')}"><input type="text" data-bind="${prefix}.gradB" value="${getPath(prefix+'.gradB')}"></div>
   <div><label style="font-size:11px">Angulo</label><div class="rangewrap"><input type="range" min="0" max="360" data-bind="${prefix}.angle" data-num="1" value="${getPath(prefix+'.angle')}"><span class="val">${getPath(prefix+'.angle')}°</span></div></div>
   <div class="gradprev" style="background:linear-gradient(${getPath(prefix+'.angle')}deg,${getPath(prefix+'.gradA')},${getPath(prefix+'.gradB')})"></div>
 </div></div>`; }
function opacityField(prefix){ const v=getPath(prefix+'.opacity'); return `<div class="fld"><label>Opacidad de la capa de color <span class="hint" style="display:inline">(baja para ver el fondo global)</span></label><div class="rangewrap"><input type="range" min="0" max="1" step="0.01" data-bind="${prefix}.opacity" data-num="1" value="${v}"><span class="val">${Math.round(v*100)}%</span></div></div>`; }
function imgField(label,path,hint){ const v=getPath(path)||""; return `<div class="fld"><label>${label}</label><div class="imgrow"><div class="imgthumb">${v?`<img src="${v}">`:"sin img"}</div><input type="text" data-bind="${path}" value="${esc(v)}" placeholder="URL de imagen (PNG transparente)"><label class="uploadbtn">Subir<input type="file" accept="image/*" data-upload="${path}" style="display:none"></label></div>${hint?`<div class="hint">${hint}</div>`:""}</div>`; }
function selectField(label,path,options){const v=getPath(path);return `<div class="fld"><label>${label}</label><select class="selfld" data-bind="${path}">${options.map(([val,txt])=>`<option value="${val}"${v===val?' selected':''}>${txt}</option>`).join("")}</select></div>`;}
function switchField(label,path){const v=getPath(path);return `<div class="fld" style="display:flex;align-items:center;justify-content:space-between;gap:14px"><label style="margin:0">${label}</label><label class="switch"><input type="checkbox" data-bind="${path}" ${v?'checked':''}><span class="sl"></span></label></div>`;}
function listEditor(path,labeler,fieldsFn,tplKey,renum){
  const arr=getPath(path)||[];
  return arr.map((it,i)=>`<details class="acc"><summary>${esc(labeler(it,i))}</summary><div class="accbody">${fieldsFn(i)}<button class="ad-btn warn" data-del="${path}" data-i="${i}"${renum?' data-renum="1"':''}>Eliminar</button></div></details>`).join("")
    + `<button class="miniadd" data-add="${path}" data-tpl="${tplKey}">+ Agregar</button>`;
}

const TPL={
  project:()=>{const n=clone(DEFAULTS.projects[0]);n.id="proyecto-"+Date.now();n.name="Nuevo proyecto";n.ghost="NUEVO";n.mono="NP";n.img="";return n;},

  logo:()=>({name:"Nuevo",img:""}),
  card:()=>({title:"Nuevo",img:""}),
  group:()=>({num:"00",title:"Nuevo grupo",links:["Servicio"]}),
  region:()=>({name:"Nueva region",flag:""})
};

/* ----- binding ----- */
function bindAdmin(){
  const main=document.getElementById("adMain");
  main.querySelectorAll("[data-bind]").forEach(el=>{
    const p=el.getAttribute("data-bind");
    const handler=()=>{
      let v;
      if(el.type==="checkbox") v=el.checked;
      else if(el.dataset.list==="commas") v=el.value.split(",").map(s=>s.trim()).filter(Boolean);
      else if(el.dataset.list==="lines") v=el.value.split("\n").map(s=>s.trim()).filter(Boolean);
      else if(el.dataset.list==="steps") v=el.value.split("\n").map(s=>s.trim()).filter(Boolean).map((t,i)=>[String(i+1).padStart(2,"0"),t]);
      else if(el.dataset.num) v=parseFloat(el.value);
      else v=el.value;
      setPath(p,v);
      if(el.type==="range"){ const lbl=el.parentElement.querySelector(".val"); if(lbl) lbl.textContent=p.endsWith("opacity")?Math.round(v*100)+"%":(p.endsWith("angle")?v+"°":v); }
      const gp=el.closest(".fld"); if(gp){const pv=gp.querySelector(".gradprev"); if(pv){const base=p.split(".").slice(0,-1).join("."); pv.style.background=`linear-gradient(${getPath(base+'.angle')}deg,${getPath(base+'.gradA')},${getPath(base+'.gradB')})`;}}
    };
    el.addEventListener("input",handler);
    if(el.tagName==="SELECT"||el.type==="checkbox") el.addEventListener("change",handler);
  });
  main.querySelectorAll("[data-color]").forEach(el=>{ const p=el.getAttribute("data-color"); el.addEventListener("input",()=>{ setPath(p,el.value); const t=el.parentElement.querySelector("[data-bind='"+p+"']"); if(t)t.value=el.value; const gp=el.closest(".fld"); if(gp){const pv=gp.querySelector(".gradprev"); if(pv){const base=p.split(".").slice(0,-1).join("."); pv.style.background=`linear-gradient(${getPath(base+'.angle')}deg,${getPath(base+'.gradA')},${getPath(base+'.gradB')})`;}} }); });
  main.querySelectorAll("[data-upload]").forEach(inp=>{ inp.addEventListener("change",()=>{ const f=inp.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{ setPath(inp.getAttribute("data-upload"), r.result); buildAdmin(); }; r.readAsDataURL(f); }); });
  main.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{ const arr=getPath(b.dataset.add); arr.push(TPL[b.dataset.tpl]()); if(b.dataset.tpl==="group")arr.forEach((g,i)=>g.num=String(i+1).padStart(2,"0")); buildAdmin(); });
  main.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ const arr=getPath(b.dataset.del); arr.splice(+b.dataset.i,1); if(b.dataset.renum)arr.forEach((g,i)=>g.num=String(i+1).padStart(2,"0")); buildAdmin(); });
  const list=document.getElementById("dragList");
  if(list){ let dragEl=null;
    list.querySelectorAll(".drag-item").forEach(it=>{
      it.addEventListener("dragstart",()=>{dragEl=it;it.classList.add("dragging");});
      it.addEventListener("dragend",()=>{it.classList.remove("dragging"); CONFIG.order=[...list.querySelectorAll(".drag-item")].map(x=>x.dataset.key);});
    });
    list.addEventListener("dragover",e=>{e.preventDefault(); const after=[...list.querySelectorAll(".drag-item:not(.dragging)")].reduce((c,ch)=>{const box=ch.getBoundingClientRect();const off=e.clientY-box.top-box.height/2; return off<0&&off>c.off?{off,el:ch}:c;},{off:-Infinity}).el; if(!dragEl)return; if(after==null)list.appendChild(dragEl); else list.insertBefore(dragEl,after);});
  }
}
document.getElementById("adSave").onclick=()=>{ persist(); const t=document.getElementById("toast"); t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1800); };
document.getElementById("adView").onclick=()=>{ persist(); location.hash=""; };
document.getElementById("adReset").onclick=()=>{ if(confirm("Restablecer todo a los valores por defecto?")){ CONFIG=clone(DEFAULTS); persist(); buildAdmin(); } };
document.getElementById("adExport").onclick=()=>{ const blob=new Blob([JSON.stringify(CONFIG,null,2)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="jeetp-config.json"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); };

/* boot */
route();
